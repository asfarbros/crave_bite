<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
</head>
<body class="bg-[#fefae0] text-[#333] min-h-screen flex flex-col">

  <!-- Navbar -->
  <!-- Navigation Bar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html"><h1 class="text-3xl font-bold pacifico text-yellow-500">CraveBite</h1></a>
      <nav class="flex items-center space-x-6 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500 transition-colors">Home</a>
        <a href="menu.html" class="hover:text-yellow-500 transition-colors">Order</a>
        <a href="booking.html" class="hover:text-yellow-500 transition-colors">Booking</a>
        <a href="events.html" class="hover:text-yellow-500 transition-colors">Events</a>
        <a href="cart.html" class="hover:text-yellow-500 transition-colors">Cart</a>
        <a href="myorders.html" id="ordersLink" class="hidden hover:text-yellow-500 transition-colors">My Orders</a>
        
        <div id="authButtons" class="inline-flex items-center space-x-4 ml-2">
          <a href="login.html" class="text-yellow-600 hover:text-yellow-500 font-semibold transition-colors">Login</a>
          <a href="signup.html" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-bold shadow-sm transition-transform hover:scale-105 active:scale-95">Sign Up</a>
        </div>
        
        <div id="userMenu" class="hidden items-center space-x-4 ml-2">
          <button id="logoutBtn" class="text-red-500 hover:text-red-600 font-semibold transition-colors">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Cart Content -->
  <main class="flex-grow flex flex-col items-center p-6">
    <h2 class="text-4xl font-bold mt-8 mb-8 text-yellow-700">Your Cart</h2>

    <div id="cartItems" class="w-full max-w-2xl space-y-4"></div>

    <div class="mt-6 text-2xl font-semibold text-yellow-800" id="totalAmount"></div>

    <div class="mt-10 flex space-x-4">
      <a href="menu.html">
        <button class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-6 rounded-full transition duration-300">
          Back to Menu
        </button>
      </a>
      <a href="checkout.html" id="checkoutLink">
        <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full transition duration-300">
          Checkout
        </button>
      </a>
    </div>
  </main>

  <!-- Script -->
  <script>
    const cartItemsDiv = document.getElementById('cartItems');
    const totalAmountDiv = document.getElementById('totalAmount');
    const checkoutLink = document.getElementById('checkoutLink');

    async function loadCart() {
      try {
        const user = JSON.parse(localStorage.getItem('user'));
        const userId = user?.id;

        const res = await fetch(`${API_URL}/api/cart?userId=${userId}`);
        const data = await res.json();

        if (!data.success || !data.items.length) {
          cartItemsDiv.innerHTML = "<p class='text-xl text-gray-500'>Your cart is empty.</p>";
          totalAmountDiv.innerText = '';
          return;
        }

        let total = 0;
        cartItemsDiv.innerHTML = ''; // Clear previous items

        data.items.forEach(item => {
          total += item.price * item.quantity;

          const itemDiv = document.createElement('div');
          itemDiv.className = "flex justify-between items-center bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition";

          const info = document.createElement('div');
          info.innerHTML = `
            <p class="text-lg font-semibold text-yellow-800">${item.name}</p>
            <p class="text-gray-600">
              â‚¹${item.price} x 
              <span id="qty-${item._id}">${item.quantity}</span>
            </p>
          `;

          const controls = document.createElement('div');
          controls.className = "flex space-x-2 items-center";

          const minusBtn = document.createElement('button');
          minusBtn.textContent = "-";
          minusBtn.className = "bg-red-500 text-white px-3 py-1 rounded-full text-lg";
          minusBtn.onclick = () => updateQuantity(item._id, item.quantity - 1);

          const plusBtn = document.createElement('button');
          plusBtn.textContent = "+";
          plusBtn.className = "bg-green-500 text-white px-3 py-1 rounded-full text-lg";
          plusBtn.onclick = () => updateQuantity(item._id, item.quantity + 1);

          controls.appendChild(minusBtn);
          controls.appendChild(plusBtn);

          itemDiv.appendChild(info);
          itemDiv.appendChild(controls);
          cartItemsDiv.appendChild(itemDiv);
        });

        totalAmountDiv.innerText = `Total: â‚¹${total}`;
        checkoutLink.href = `checkout.html?total=${total}`;
      } catch (error) {
        console.error('Error fetching cart:', error);
        cartItemsDiv.innerHTML = "<p class='text-red-500'>Failed to load cart items.</p>";
      }
    }

    async function updateQuantity(itemId, newQty) {
      if (newQty <= 0) return; // prevent going to 0 or negative

      const res = await fetch(`${API_URL}/api/cart/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity: newQty })
      });

      const data = await res.json();
      if (data.success) {
        loadCart(); // refresh cart display
      }
    }

    // Initial cart load
    loadCart();
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
