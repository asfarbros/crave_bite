<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Menu - CraveBite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
    }
    h1 {
      font-family: 'Pacifico', cursive;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold pacifico text-yellow-500">CraveBite</h1>
      <nav class="space-x-4 text-yellow-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500">Home</a>
        <a href="cart.html" class="hover:text-yellow-500">Cart</a>
      </nav>
    </div>
  </header>

  <!-- Header -->
  <header class="text-center py-10">
    <h1 class="text-5xl text-yellow-400 drop-shadow-md">Our Delicious Menu</h1>
    <p class="text-gray-300 mt-4 text-lg">Pick your favorite dishes and enjoy!</p>
  </header>

  <!-- Menu Grid -->
  <main id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 px-8 pb-16">
    <!-- Items will be loaded dynamically here -->
    <div class="col-span-full text-center text-xl text-yellow-300 py-10">
      Loading our delicious menu...
    </div>
  </main>

  <script>
    async function loadMenu() {
      try {
        const response = await fetch('http://localhost:5000/api/foods');
        const data = await response.json();
        const menuGrid = document.getElementById('menu-grid');
        
        if (data.success && data.data.length > 0) {
          menuGrid.innerHTML = ''; // clear loading text
          
          data.data.forEach(food => {
            const card = document.createElement('div');
            card.className = "bg-white/10 p-6 rounded-2xl shadow-lg hover:scale-105 transition-all duration-300 flex flex-col h-full";
            
            // Note: Since you're passing strings in onclick, we need to make sure to escape single quotes properly, 
            // but assuming food names don't have single quotes for now based on the seed data.
            card.innerHTML = `
              <img src="${food.imageUrl}" alt="${food.name}" class="rounded-xl mb-4 w-full h-48 object-cover"/>
              <h2 class="text-2xl font-bold text-yellow-300 mb-2">${food.name}</h2>
              <p class="text-sm text-gray-200 flex-grow">${food.description || ''}</p>
              <div class="flex justify-between items-center mt-4">
                <span class="text-yellow-400 font-semibold text-lg">₹${food.price}</span>
                <button onclick="addToCart('${food.name}', ${food.price})" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded-full shadow transition hover:scale-105">
                  Add to Cart
                </button>
              </div>
            `;
            menuGrid.appendChild(card);
          });
        } else {
          menuGrid.innerHTML = '<div class="col-span-full text-center text-xl text-red-400">Failed to load menu or no items available.</div>';
        }
      } catch (error) {
        console.error('Error loading menu:', error);
        document.getElementById('menu-grid').innerHTML = '<div class="col-span-full text-center text-xl text-red-400">Failed to connect to the server.</div>';
      }
    }

    // Call the function when page loads
    window.addEventListener('DOMContentLoaded', loadMenu);
  </script>

  <!-- Cart Script -->
  <script>
      function addToCart(name, price) {
        const user = JSON.parse(localStorage.getItem('user'));
        const userId = user?.id;
        console.log("Sending userId:", userId); 

        fetch('http://localhost:5000/api/cart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, quantity: 1, userId })  // Add userId
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showNotification(`${name} added to cart!`);
          }
        })
        .catch(err => console.error('Error adding to cart:', err));

        
      }

      
      // Show success message


    function showNotification(message) {
      // Create notification element
      const notification = document.createElement('div');
      notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transform transition-all duration-300 translate-x-full';
      notification.textContent = message;
      
      document.body.appendChild(notification);
      
      // Animate in
      setTimeout(() => {
        notification.classList.remove('translate-x-full');
      }, 100);
      
      // Remove after 3 seconds
      setTimeout(() => {
        notification.classList.add('translate-x-full');
        setTimeout(() => {
          document.body.removeChild(notification);
        }, 300);
      }, 3000);
    }
  </script>
</body>
</html>
