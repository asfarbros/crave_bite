<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CraveBite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .pacifico { font-family: 'Pacifico', cursive; }
  </style>
  <script src="js/config.js"></script>
  <script>
    // Security check before rendering
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));
    
    if (!token || !user || user.role !== 'admin') {
      window.location.href = 'index.html'; // Redirect unauthorized users
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Admin Navbar (Standalone) -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold pacifico text-yellow-500">CraveBite <span class="text-lg text-gray-400 font-sans">Admin</span></h1>
      <nav class="flex items-center space-x-6 text-gray-700 font-medium">
        <button onclick="switchTab('menuTab')" id="nav-menu" class="text-yellow-600 font-bold transition-colors">Menu Management</button>
        <button onclick="switchTab('ordersTab')" id="nav-orders" class="hover:text-yellow-500 transition-colors">Orders</button>
        <button onclick="adminLogout()" class="text-red-500 hover:text-red-600 font-semibold transition-colors ml-4 border-l pl-4 border-gray-300">Logout</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full p-6">
    
    <!-- Menu Management Section -->
    <section id="menuTab" class="block">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Menu Management</h2>
        <button onclick="openModal('addModal')" class="bg-yellow-400 hover:bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold shadow transition-transform hover:scale-105">
          + Add New Dish
        </button>
      </div>

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Available</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="menuTableBody" class="bg-white divide-y divide-gray-200">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Orders Section -->
    <section id="ordersTab" class="hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Customer Orders</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="ordersGrid">
        <!-- Populated via JS -->
      </div>
    </section>

  </main>

  <!-- Add/Edit Food Modal -->
  <div id="foodModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl p-8 max-w-md w-full shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      <h3 id="modalTitle" class="text-2xl font-bold mb-6 text-gray-800">Add New Dish</h3>
      
      <form id="foodForm" onsubmit="handleFoodSubmit(event)" class="space-y-4">
        <input type="hidden" id="foodId">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
          <input type="text" id="foodName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="foodDesc" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
            <input type="number" id="foodPrice" required min="0" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <input type="text" id="foodCategory" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none">
          </div>
        </div>

        <div id="imageUploadContainer">
          <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
          <input type="file" id="foodImage" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
          <p id="imageHelperText" class="text-xs text-gray-500 mt-1">Leave blank to keep existing image</p>
        </div>

        <div class="flex items-center mt-2" id="availabilityContainer">
          <input type="checkbox" id="foodAvailable" class="h-4 w-4 text-yellow-500 rounded focus:ring-yellow-400">
          <label class="ml-2 block text-sm text-gray-700">Available</label>
        </div>

        <div id="formError" class="text-red-500 text-sm hidden"></div>

        <button type="submit" id="submitBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black py-2 rounded-lg font-bold transition">
          Save Dish
        </button>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative animate-[fadeIn_0.3s_ease-out]">
      <button onclick="closeDeleteModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <h2 class="text-2xl font-bold mb-4 text-red-600">Delete Dish</h2>
      <p class="text-gray-700 mb-6">Are you sure you want to delete this dish? This action cannot be undone.</p>
      
      <div class="flex justify-end space-x-3">
        <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-medium hover:bg-gray-300 transition">Cancel</button>
        <button onclick="confirmDelete()" id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'menuTab';

    function switchTab(tabId) {
      document.getElementById('menuTab').classList.add('hidden');
      document.getElementById('ordersTab').classList.add('hidden');
      document.getElementById('nav-menu').classList.remove('text-yellow-600', 'font-bold');
      document.getElementById('nav-orders').classList.remove('text-yellow-600', 'font-bold');
      
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById(tabId === 'menuTab' ? 'nav-menu' : 'nav-orders').classList.add('text-yellow-600', 'font-bold');
      
      if (tabId === 'menuTab') loadMenu();
      if (tabId === 'ordersTab') loadOrders();
    }

    async function adminLogout() {
      try {
        await fetch(`${API_URL}/api/auth/logout`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch(e) {}
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    // --- MENU MANAGEMENT ---
    async function loadMenu() {
      try {
        const res = await fetch(`${API_URL}/api/foods?all=true`);
        const data = await res.json();
        if(data.success) {
          const tbody = document.getElementById('menuTableBody');
          tbody.innerHTML = '';
          data.data.forEach(food => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="px-6 py-4 whitespace-nowrap">
                <img src="${food.imageUrl}" class="h-12 w-12 rounded-lg object-cover shadow-sm">
              </td>
              <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${food.name}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${food.category}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">₹${food.price}</td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${food.isAvailable ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                  ${food.isAvailable ? 'Yes' : 'No'}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <button onclick='editFood(${JSON.stringify(food)})' class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</button>
                <button onclick="deleteFood('${food._id}')" class="text-red-600 hover:text-red-900">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (error) {
        console.error("Error loading menu:", error);
      }
    }

    function openModal(mode, food = null) {
      document.getElementById('foodModal').classList.remove('hidden');
      document.getElementById('formError').classList.add('hidden');
      document.getElementById('submitBtn').innerText = 'Save Dish';
      document.getElementById('submitBtn').disabled = false;

      if (mode === 'addModal') {
        document.getElementById('modalTitle').innerText = 'Add New Dish';
        document.getElementById('foodForm').reset();
        document.getElementById('foodId').value = '';
        document.getElementById('foodImage').required = true;
        document.getElementById('imageHelperText').classList.add('hidden');
        document.getElementById('availabilityContainer').classList.add('hidden');
      } else {
        document.getElementById('modalTitle').innerText = 'Edit Dish';
        document.getElementById('foodId').value = food._id;
        document.getElementById('foodName').value = food.name;
        document.getElementById('foodDesc').value = food.description || '';
        document.getElementById('foodPrice').value = food.price;
        document.getElementById('foodCategory').value = food.category;
        document.getElementById('foodAvailable').checked = food.isAvailable;
        document.getElementById('foodImage').required = false;
        document.getElementById('imageHelperText').classList.remove('hidden');
        document.getElementById('availabilityContainer').classList.remove('hidden');
      }
    }

    function closeModal() {
      document.getElementById('foodModal').classList.add('hidden');
    }

    function editFood(food) {
      openModal('edit', food);
    }

    async function handleFoodSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errDiv = document.getElementById('formError');
      btn.disabled = true;
      btn.innerText = 'Saving...';
      errDiv.classList.add('hidden');

      const id = document.getElementById('foodId').value;
      const fileInput = document.getElementById('foodImage');
      
      try {
        let imageBase64 = null;
        if (fileInput.files && fileInput.files[0]) {
          imageBase64 = await toBase64(fileInput.files[0]);
        }

        const payload = {
          name: document.getElementById('foodName').value,
          description: document.getElementById('foodDesc').value,
          price: document.getElementById('foodPrice').value,
          category: document.getElementById('foodCategory').value,
        };

        if (imageBase64) payload.imageBase64 = imageBase64;
        if (id) payload.isAvailable = document.getElementById('foodAvailable').checked;

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/api/foods/${id}` : `${API_URL}/api/foods`;

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          closeModal();
          loadMenu();
        } else {
          errDiv.innerText = data.message || 'Error saving dish';
          errDiv.classList.remove('hidden');
        }
      } catch (error) {
        errDiv.innerText = 'Network error occurred';
        errDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Dish';
      }
    }

    let deleteItemId = null;

    function deleteFood(id) {
      deleteItemId = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
      deleteItemId = null;
    }

    async function confirmDelete() {
      if(!deleteItemId) return;
      const btn = document.getElementById('confirmDeleteBtn');
      
      try {
        btn.disabled = true;
        btn.innerText = 'Deleting...';
        const res = await fetch(`${API_URL}/api/foods/${deleteItemId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if(res.ok) {
          closeDeleteModal();
          loadMenu();
        } else {
          console.error("Delete failed");
        }
      } catch (error) {
        console.error("Delete failed:", error);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Delete';
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    // --- ORDERS MANAGEMENT ---
    async function loadOrders() {
      try {
        const res = await fetch(`${API_URL}/api/order/all`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const grid = document.getElementById('ordersGrid');
        grid.innerHTML = '';
        
        if (data.success && data.orders.length > 0) {
          data.orders.forEach(order => {
            let total = order.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const div = document.createElement('div');
            div.className = "bg-white p-6 rounded-xl shadow-md border-t-4 border-yellow-400 flex flex-col justify-between";
            div.innerHTML = `
              <div>
                <div class="flex justify-between items-start mb-4">
                  <p class="text-sm text-gray-500">Order ID: <br><span class="font-mono text-xs">${order._id}</span></p>
                  <span class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded border">Placed</span>
                </div>
                <p class="text-sm font-bold text-gray-800 mb-2">User ID: ${order.userId}</p>
                <p class="text-xs text-gray-500 mb-3">${new Date(order.createdAt).toLocaleString()}</p>
                <div class="bg-gray-50 p-3 rounded-lg max-h-32 overflow-y-auto mb-4 border">
                  <ul class="space-y-1 text-sm text-gray-700">
                    ${order.items.map(item => `<li><span class="font-bold">${item.quantity}x</span> ${item.name} - ₹${item.price}</li>`).join('')}
                  </ul>
                </div>
              </div>
              <div class="pt-4 flex justify-between items-center">
                <p class="font-bold text-green-700">Total: ₹${total}</p>
              </div>
            `;
            grid.appendChild(div);
          });
        } else {
          grid.innerHTML = '<p class="text-gray-500 col-span-full">No orders found.</p>';
        }
      } catch (error) {
        console.error("Error loading orders:", error);
      }
    }

    // Initialize
    loadMenu();

  </script>
</body>
</html>
