<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Email Service - CraveBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f5dc, #deb887, #d2b48c);
        }
        .pacifico {
            font-family: 'Pacifico', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md mx-4">
        <div class="text-center">
            <h1 class="text-3xl font-bold pacifico text-yellow-500 mb-6">CraveBite</h1>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Activate Email Service</h2>
            <p class="text-gray-600 mb-6">Click the button below to activate email sending for your Gmail account.</p>
            
            <button id="activate-btn" class="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-black font-bold py-4 px-8 rounded-full shadow-lg transition-all duration-300 hover:scale-105 transform mb-6">
                Activate Email Service
            </button>
            
            <div id="status" class="hidden">
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                    <p class="font-bold">✅ Activation Successful!</p>
                    <p class="text-sm">Check your Gmail for a confirmation email from FormSubmit.</p>
                </div>
                <a href="booking.html" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                    Go to Booking Page
                </a>
            </div>
            
            <div class="mt-6 text-sm text-gray-500">
                <p>This will activate email sending for: <strong>akashhsaka6002@gmail.com</strong></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('activate-btn').addEventListener('click', function() {
            // Simulate activation process
            this.textContent = 'Activating...';
            this.disabled = true;
            
            setTimeout(() => {
                // Show success message
                document.getElementById('status').classList.remove('hidden');
                this.style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
