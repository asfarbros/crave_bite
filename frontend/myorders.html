<!-- myorders.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
</head>
<body class="bg-[#fefae0] min-h-screen text-gray-800">
  <!-- Navigation Bar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html"><h1 class="text-3xl font-bold pacifico text-yellow-500">CraveBite</h1></a>
      <nav class="flex items-center space-x-6 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500 transition-colors">Home</a>
        <a href="menu.html" class="hover:text-yellow-500 transition-colors">Order</a>
        <a href="booking.html" class="hover:text-yellow-500 transition-colors">Booking</a>
        <a href="events.html" class="hover:text-yellow-500 transition-colors">Events</a>
        <a href="cart.html" class="hover:text-yellow-500 transition-colors">Cart</a>
        <a href="myorders.html" id="ordersLink" class="hidden hover:text-yellow-500 transition-colors">My Orders</a>
        
        <div id="authButtons" class="inline-flex items-center space-x-4 ml-2">
          <a href="login.html" class="text-yellow-600 hover:text-yellow-500 font-semibold transition-colors">Login</a>
          <a href="signup.html" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-bold shadow-sm transition-transform hover:scale-105 active:scale-95">Sign Up</a>
        </div>
        
        <div id="userMenu" class="hidden items-center space-x-4 ml-2">
          <button id="logoutBtn" class="text-red-500 hover:text-red-600 font-semibold transition-colors">Logout</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="p-6 max-w-3xl mx-auto">
    <div id="ordersContainer" class="space-y-6"></div>
  </main>

  <script>
    async function loadOrders() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('ordersContainer').innerHTML = "<p>Please login to view orders.</p>";
        return;
      }

      try {
        const res = await fetch(API_URL + '/api/order/myorders', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();

        const container = document.getElementById('ordersContainer');

        if (!data.success || data.orders.length === 0) {
          container.innerHTML = "<p class='text-xl text-gray-500'>No orders yet.</p>";
          return;
        }

        data.orders.forEach(order => {
          const total = order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);

          const div = document.createElement('div');
          div.className = "bg-white p-4 rounded-xl shadow";

          div.innerHTML = `
            <p class="text-lg font-bold text-yellow-800">Order Date: ${new Date(order.createdAt).toLocaleString()}</p>
            <ul class="mt-2 space-y-1 text-gray-700">
              ${order.items.map(item => `<li>${item.name} - ₹ ${item.price} x ${item.quantity}</li>`).join('')}
            </ul>
            <p class="mt-2 font-semibold text-green-700">Total: ₹ ${total}</p> 
          `;

          container.appendChild(div);
        });

      } catch (err) {
        console.error("Error loading orders", err);
      }
    }

    loadOrders();
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
