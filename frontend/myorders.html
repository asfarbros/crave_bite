<!-- myorders.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fefae0] min-h-screen text-gray-800">
  <header class="bg-white shadow-md p-4">
    <h1 class="text-2xl font-bold text-yellow-700">My Orders</h1>
      <nav class="space-x-4 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500">Home</a>
      </nav>
  </header>

  <main class="p-6 max-w-3xl mx-auto">
    <div id="ordersContainer" class="space-y-6"></div>
  </main>

  <script>
    async function loadOrders() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('ordersContainer').innerHTML = "<p>Please login to view orders.</p>";
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/api/order/myorders', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();

        const container = document.getElementById('ordersContainer');

        if (!data.success || data.orders.length === 0) {
          container.innerHTML = "<p class='text-xl text-gray-500'>No orders yet.</p>";
          return;
        }

        data.orders.forEach(order => {
          const total = order.items.reduce((sum, item) => sum + item.price * item.quantity, 0);

          const div = document.createElement('div');
          div.className = "bg-white p-4 rounded-xl shadow";

          div.innerHTML = `
            <p class="text-lg font-bold text-yellow-800">Order Date: ${new Date(order.createdAt).toLocaleString()}</p>
            <ul class="mt-2 space-y-1 text-gray-700">
              ${order.items.map(item => `<li>${item.name} - ₹${item.price} x ${item.quantity}</li>`).join('')}
            </ul>
            <p class="mt-2 font-semibold text-green-700">Total: ₹${total}</p>
          `;

          container.appendChild(div);
        });

      } catch (err) {
        console.error("Error loading orders", err);
      }
    }

    loadOrders();
  </script>
</body>
</html>
