<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - CraveBite</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1 {
      font-family: 'Pacifico', cursive;
    }
    .payment-element {
      margin-bottom: 24px;
    }
    .spinner,
    .spinner:before,
    .spinner:after {
      border-radius: 50%;
    }
    .spinner {
      color: #ffffff;
      font-size: 22px;
      text-indent: -99999px;
      margin: 0px auto;
      position: relative;
      width: 20px;
      height: 20px;
      box-shadow: inset 0 0 0 2px;
      -webkit-transform: translateZ(0);
      -ms-transform: translateZ(0);
      transform: translateZ(0);
    }
    .spinner:before,
    .spinner:after {
      position: absolute;
      content: '';
    }
    .spinner:before {
      width: 10.4px;
      height: 20.4px;
      background: #5469d4;
      border-radius: 20.4px 0 0 20.4px;
      top: -0.2px;
      left: -0.2px;
      -webkit-transform-origin: 10.4px 10.2px;
      transform-origin: 10.4px 10.2px;
      -webkit-animation: loading 2s infinite ease 1.5s;
      animation: loading 2s infinite ease 1.5s;
    }
    .spinner:after {
      width: 10.4px;
      height: 10.2px;
      background: #5469d4;
      border-radius: 0 10.2px 10.2px 0;
      top: -0.1px;
      left: 10.2px;
      -webkit-transform-origin: 0px 10.2px;
      transform-origin: 0px 10.2px;
      -webkit-animation: loading 2s infinite ease;
      animation: loading 2s infinite ease;
    }
    @-webkit-keyframes loading {
      0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
    @keyframes loading {
      0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
  </style>
<script src="js/config.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Navbar -->
   <!-- Navigation Bar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html"><h1 class="text-3xl font-bold pacifico text-yellow-500">CraveBite</h1></a>
      <nav class="flex items-center space-x-6 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500 transition-colors">Home</a>
        <a href="menu.html" class="hover:text-yellow-500 transition-colors">Order</a>
        <a href="booking.html" class="hover:text-yellow-500 transition-colors">Booking</a>
        <a href="events.html" class="hover:text-yellow-500 transition-colors">Events</a>
        <a href="cart.html" class="hover:text-yellow-500 transition-colors">Cart</a>
        <a href="myorders.html" id="ordersLink" class="hidden hover:text-yellow-500 transition-colors">My Orders</a>
        
        <div id="authButtons" class="inline-flex items-center space-x-4 ml-2">
          <a href="login.html" class="text-yellow-600 hover:text-yellow-500 font-semibold transition-colors">Login</a>
          <a href="signup.html" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-bold shadow-sm transition-transform hover:scale-105 active:scale-95">Sign Up</a>
        </div>
        
        <div id="userMenu" class="hidden items-center space-x-4 ml-2">
          <button id="logoutBtn" class="text-red-500 hover:text-red-600 font-semibold transition-colors">Logout</button>
        </div>
      </nav>
    </div>
  </header>


  <!-- Checkout Form -->
  <div class="max-w-2xl mx-auto bg-white p-8 mt-10 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-yellow-500">Checkout</h2>
    <form id="checkoutForm">
      <div class="mb-4">
        <label class="block font-semibold mb-1">Full Name</label>
        <input type="text" required class="w-full border border-gray-300 p-2 rounded" />
      </div>
      <div class="mb-4">
        <label class="block font-semibold mb-1">Email</label>
        <input type="email" required class="w-full border border-gray-300 p-2 rounded" />
      </div>
      <div class="mb-4">
        <label class="block font-semibold mb-1">Address</label>
        <textarea required class="w-full border border-gray-300 p-2 rounded"></textarea>
      </div>

      <!-- Order Summary -->
      <div class="mb-6 p-4 bg-gray-50 rounded-lg">
        <h3 class="font-semibold mb-2">Order Summary</h3>
                 <div class="flex justify-between mb-2">
           <span>Subtotal:</span>
           <span id="subtotal">â‚¹0.00</span>
         </div>
         <div class="flex justify-between mb-2">
           <span>Tax (8.5%):</span>
           <span id="tax">â‚¹0.00</span>
         </div>
         <div class="flex justify-between font-bold text-lg">
           <span>Total:</span>
           <span id="total">â‚¹0.00</span>
         </div>
      </div>

      <!-- Payment Method Selection -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Payment Method</label>
        <div class="space-y-2">
          <label class="flex items-center">
            <input type="radio" name="paymentMethod" value="card" checked class="mr-2">
            <span>Credit/Debit Card</span>
          </label>
          <label class="flex items-center">
            <input type="radio" name="paymentMethod" value="cod" class="mr-2">
            <span>Cash on Delivery</span>
          </label>
        </div>
      </div>

      <!-- Stripe Payment Element -->
      <div id="card-element" class="mb-4 hidden">
        <div id="payment-loading" class="text-center py-4">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-yellow-500 mx-auto mb-2"></div>
          <p class="text-gray-600">Loading payment form...</p>
        </div>
                 <div id="payment-element" class="payment-element">
           <!-- Stripe Payment Element will be mounted here -->
         </div>
      </div>

      <button type="submit" id="submit-button" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 px-6 rounded-full w-full transition-all duration-300 hover:scale-105">
        <span id="button-text">Place Order</span>
        <div id="spinner" class="spinner hidden"></div>
      </button>
    </form>
    <div id="successMessage" class="text-green-600 font-semibold mt-6 hidden text-center">
      ðŸŽ‰ Order placed successfully! Check your email for confirmation.
    </div>
    <div id="errorMessage" class="text-red-600 font-semibold mt-6 hidden text-center">
    </div>
  </div>

  <script>
    // Stripe configuration
    const stripe = Stripe('pk_test_51RqgzcRXkMEPeVyWnPUATveye8itlX81ZhK1Bn6yJS6nnQgSv18eyc6m4gEAad82rLqOpXJ1BCg0fDOILDF7nea500x0FM9gqF');
    let elements;
    let paymentElement;
    let clientSecret;

    // Get order data from URL parameters or use defaults
    function getOrderData() {
      const urlParams = new URLSearchParams(window.location.search);
      const total = parseFloat(urlParams.get('total')) || 25.99;
      const subtotal = total / 1.085; // Remove tax (8.5%)
      const tax = total - subtotal;
      
      return {
        subtotal: subtotal,
        tax: tax,
        total: total
      };
    }
    
    const orderData = getOrderData();

         // Initialize order summary
     function initializeOrderSummary() {
       document.getElementById('subtotal').textContent = `â‚¹${orderData.subtotal.toFixed(2)}`;
       document.getElementById('tax').textContent = `â‚¹${orderData.tax.toFixed(2)}`;
       document.getElementById('total').textContent = `â‚¹${orderData.total.toFixed(2)}`;
     }

    // Handle payment method selection
    function handlePaymentMethodChange() {
      const cardElement = document.getElementById('card-element');
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      
      console.log('Payment method changed to:', paymentMethod);
      
      if (paymentMethod === 'card') {
        cardElement.classList.remove('hidden');
        console.log('Card element shown, initializing Stripe...');
        // Always initialize Stripe when card is selected
        initializeStripe();
      } else {
        cardElement.classList.add('hidden');
        console.log('Card element hidden');
      }
    }

    // Initialize Stripe Elements
    async function initializeStripe() {
      try {
        console.log('Initializing Stripe...');
        console.log('Order data:', orderData);
        
        // Show loading indicator
        const loadingElement = document.getElementById('payment-loading');
        const paymentElementDiv = document.getElementById('payment-element');
        loadingElement.style.display = 'block';
        paymentElementDiv.style.display = 'none';
        
        // Create payment intent
        const response = await fetch(API_URL + '/api/payment/create-payment-intent', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            amount: orderData.total,
            currency: 'usd'
          })
        });

        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Response data:', data);
        
        if (data.success) {
          clientSecret = data.clientSecret;
          console.log('Client secret received:', clientSecret ? 'Yes' : 'No');
          
          const appearance = {
            theme: 'stripe',
            variables: {
              colorPrimary: '#eab308',
            },
          };

          elements = stripe.elements({ appearance, clientSecret });
          paymentElement = elements.create('payment');
          paymentElement.mount('#payment-element');
          
          // Hide loading and show payment form
          loadingElement.style.display = 'none';
          paymentElementDiv.style.display = 'block';
          
          console.log('Stripe elements initialized successfully');
        } else {
          console.error('Payment intent creation failed:', data.message);
          showError('Failed to initialize payment system: ' + data.message);
          loadingElement.style.display = 'none';
        }
      } catch (error) {
        console.error('Error initializing Stripe:', error);
        showError('Failed to initialize payment system: ' + error.message);
        const loadingElement = document.getElementById('payment-loading');
        loadingElement.style.display = 'none';
      }
    }

    // Show error message
    function showError(message) {
      const errorElement = document.getElementById('errorMessage');
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
      setTimeout(() => {
        errorElement.classList.add('hidden');
      }, 5000);
    }
  // After successful order placement (either card or cod)
  async function placeOrderInBackend() {
    const token = localStorage.getItem("token");
    if (!token) return console.error("User not authenticated");

    try {
      // Send order request to backend
      const response = await fetch(API_URL + "/api/order/place", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
      });

      const data = await response.json();
      if (data.success) {
        console.log("Order placed and cart cleared");
      } else {
        console.error("Order placement failed:", data.message);
      }
    } catch (err) {
      console.error("Error placing order:", err);
    }
  }

  // Modify showSuccess function to call backend order placement
  function showSuccess() {
    placeOrderInBackend(); // Call API to store cart items to orders
    document.getElementById("successMessage").classList.remove("hidden");
    setTimeout(() => {
      window.location.href = "success.html?total=" + orderData.total;
    }, 3000);
  }

         // Show success message


    // Handle form submission
    document.getElementById('checkoutForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      
      const submitButton = document.getElementById('submit-button');
      const buttonText = document.getElementById('button-text');
      const spinner = document.getElementById('spinner');
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      // Disable button and show spinner
      submitButton.disabled = true;
      buttonText.textContent = 'Processing...';
      spinner.classList.remove('hidden');

      try {
        if (paymentMethod === 'card') {
          // Process card payment
          if (!elements) {
            console.error('Elements not initialized');
            throw new Error('Payment system not initialized. Please refresh the page and try again.');
          }

                     console.log('Confirming payment...');
           // Store the total amount for the success page
           localStorage.setItem('lastOrderTotal', orderData.total.toString());
           const { error } = await stripe.confirmPayment({
             elements,
             confirmParams: {
               return_url: window.location.origin + '/success.html?total=' + orderData.total,
             },
           });

          if (error) {
            console.error('Payment confirmation error:', error);
            throw new Error(error.message);
          }
                 } else {
           // Process cash on delivery
           console.log('Processing cash on delivery...');
           // Store the total amount for the success page
           localStorage.setItem('lastOrderTotal', orderData.total.toString());
           await new Promise(resolve => setTimeout(resolve, 2000)); // Simulate processing
           showSuccess();
         }
      } catch (error) {
        console.error('Payment error:', error);
        showError(error.message || 'Payment failed. Please try again.');
        
        // Re-enable button
        submitButton.disabled = false;
        buttonText.textContent = 'Place Order';
        spinner.classList.add('hidden');
      }
    });

    // Listen for payment method changes
    document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
      radio.addEventListener('change', handlePaymentMethodChange);
    });

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      initializeOrderSummary();
      handlePaymentMethodChange();
    });
  </script>
  <script>
document.getElementById('submit-button').addEventListener('click', async (e) => {
  e.preventDefault(); // Prevent form from refreshing page

  const token = localStorage.getItem('token'); // Get JWT token
  const errorMessage = document.getElementById('errorMessage');
  const successMessage = document.getElementById('successMessage');
  const buttonText = document.getElementById('button-text');
  const spinner = document.getElementById('spinner');

  // Reset messages
  errorMessage.classList.add('hidden');
  successMessage.classList.add('hidden');

  // Show loading spinner
  buttonText.textContent = 'Placing Order...';
  spinner.classList.remove('hidden');

  if (!token) {
    errorMessage.textContent = 'You are not logged in.';
    errorMessage.classList.remove('hidden');
    buttonText.textContent = 'Place Order';
    spinner.classList.add('hidden');
    return;
  }

  try {

    const response = await fetch(API_URL + '/api/order/place' ,{
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`  // Send token
      }
    });

    const data = await response.json();

    if (data.success) {
      successMessage.classList.remove('hidden');
      successMessage.textContent = 'Order placed successfully!';
      
      // Redirect after short delay
      setTimeout(() => {
        window.location.href = '/success.html';
      }, 1500);
    } else {
      errorMessage.textContent = data.message || 'Failed to place order.';
      errorMessage.classList.remove('hidden');
    }
  } catch (err) {
    console.error(err);
    errorMessage.textContent = 'Something went wrong. Try again.';
    errorMessage.classList.remove('hidden');
  } finally {
    // Reset button
    buttonText.textContent = 'Place Order';
    spinner.classList.add('hidden');
  }
});

</script>

  <script src="js/auth.js"></script>
</body>
</html>
