<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - CraveBite</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    h1 {
      font-family: 'Pacifico', cursive;
    }
  </style>
<script src="js/config.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Navbar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold pacifico text-yellow-500">CraveBite</h1>
      <nav class="space-x-4 text-yellow-700 font-medium">
        <a href="index.html" class="hover:text-yellow-500">Home</a>
        <a href="menu.html" class="hover:text-yellow-500">Menu</a>
        <a href="cart.html" class="hover:text-yellow-500">Cart</a>
      </nav>
    </div>
  </header>

  <!-- Signup Form -->
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
          Create Your Account
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Join CraveBite and start ordering delicious food
        </p>
      </div>
      
      <form id="signupForm" class="mt-8 space-y-6 bg-white p-8 rounded-xl shadow-md">
        <div class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700">
              Full Name
            </label>
            <input 
              id="name" 
              name="name" 
              type="text" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Enter your full name"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">
              Email Address
            </label>
            <input 
              id="email" 
              name="email" 
              type="email" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Enter your email"
            />
          </div>

          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">
              Phone Number (Optional)
            </label>
            <input 
              id="phone" 
              name="phone" 
              type="tel" 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Enter your phone number"
            />
          </div>
          
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">
              Password
            </label>
            <input 
              id="password" 
              name="password" 
              type="password" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Create a password (min 6 characters)"
            />
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">
              Confirm Password
            </label>
            <input 
              id="confirmPassword" 
              name="confirmPassword" 
              type="password" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Confirm your password"
            />
          </div>

          <div>
            <label for="address" class="block text-sm font-medium text-gray-700">
              Delivery Address (Optional)
            </label>
            <textarea 
              id="address" 
              name="address" 
              rows="3"
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 focus:z-10 sm:text-sm"
              placeholder="Enter your delivery address"
            ></textarea>
          </div>
        </div>

        <div class="flex items-center">
          <input 
            id="terms" 
            name="terms" 
            type="checkbox" 
            required
            class="h-4 w-4 text-yellow-600 focus:ring-yellow-500 border-gray-300 rounded"
          />
          <label for="terms" class="ml-2 block text-sm text-gray-900">
            I agree to the 
            <a href="#" class="text-yellow-600 hover:text-yellow-500">Terms of Service</a> 
            and 
            <a href="#" class="text-yellow-600 hover:text-yellow-500">Privacy Policy</a>
          </label>
        </div>

        <div>
          <button 
            type="submit" 
            id="signupBtn"
            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-black bg-yellow-400 hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-all duration-300 hover:scale-105"
          >
            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-yellow-500 group-hover:text-yellow-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z" />
              </svg>
            </span>
            Create Account
          </button>
        </div>

        <div class="text-center">
          <p class="text-sm text-gray-600">
            Already have an account? 
            <a href="login.html" class="font-medium text-yellow-600 hover:text-yellow-500">
              Sign in here
            </a>
          </p>
        </div>
      </form>

      <!-- Success/Error Messages -->
      <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
        <span class="block sm:inline">Account created successfully! Redirecting...</span>
      </div>
      
      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
        <span class="block sm:inline" id="errorText">An error occurred.</span>
      </div>
    </div>
  </div>

  <script>
    // API Configuration
    const API_BASE_URL = API_URL + '/api';

    // DOM Elements
    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    // Show/Hide Messages
    function showMessage(type, message) {
      if (type === 'success') {
        successMessage.classList.remove('hidden');
        errorMessage.classList.add('hidden');
      } else {
        errorMessage.classList.remove('hidden');
        successMessage.classList.add('hidden');
        errorText.textContent = message;
      }
    }

    // Hide all messages
    function hideMessages() {
      successMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');
    }

    // Validate form
    function validateForm(formData) {
      const password = formData.get('password');
      const confirmPassword = formData.get('confirmPassword');
      
      if (password.length < 6) {
        showMessage('error', 'Password must be at least 6 characters long');
        return false;
      }
      
      if (password !== confirmPassword) {
        showMessage('error', 'Passwords do not match');
        return false;
      }
      
      const phone = formData.get('phone');
      if (phone && !/^[0-9]{10}$/.test(phone)) {
        showMessage('error', 'Please enter a valid 10-digit phone number');
        return false;
      }
      
      return true;
    }

    // Handle Signup
    async function handleSignup(formData) {
      try {
        signupBtn.disabled = true;
        signupBtn.textContent = 'Creating Account...';
        hideMessages();

        // Validate form
        if (!validateForm(formData)) {
          return;
        }

        const response = await fetch(`${API_BASE_URL}/auth/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            name: formData.get('name'),
            email: formData.get('email'),
            password: formData.get('password'),
            phone: formData.get('phone') || undefined,
            address: formData.get('address') || undefined
          })
        });

        const data = await response.json();

        if (data.success) {
          // Store token and user data
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          
          showMessage('success', 'Account created successfully!');
          
          // Redirect after a short delay
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showMessage('error', data.message || 'Signup failed');
        }
      } catch (error) {
        console.error('Signup error:', error);
        showMessage('error', 'Network error. Please try again.');
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    }

    // Form Submission
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(signupForm);
      await handleSignup(formData);
    });

    // Check if user is already logged in
    function checkAuthStatus() {
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      if (token && user) {
        // User is already logged in, redirect to home
        window.location.href = 'index.html';
      }
    }

    // Initialize
    checkAuthStatus();
  </script>
</body>
</html>
